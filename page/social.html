<!DOCTYPE html>

<head>

  <header class="navbar" role="banner">
    <nav class="navbar-container" role="navigation" aria-label="主导航">
      <ul class="navbar-nav">
        <li><a href="/" class="nav-link" data-nav="home" data-i18n="nav.home">首页</a></li>
        <li><a href="/products" class="nav-link" data-nav="products" data-i18n="nav.products">作品</a></li>
        <li class="nav-dropdown">
          <a href="/team" class="nav-link nav-dropdown-toggle active" data-nav="team" data-i18n="nav.team" aria-expanded="false" aria-haspopup="true">关于我们</a>
          <div class="nav-dropdown-menu" role="menu">
            <a href="/team" class="nav-dropdown-item" role="menuitem" data-nav="team-intro" data-i18n="nav.submenu.intro">团队介绍</a>
            <a href="/social" class="nav-dropdown-item" role="menuitem" data-nav="social" data-i18n="nav.submenu.social">关注我们</a>
          </div>
        </li>
      </ul>
      
      <div class="navbar-actions">
        <div class="language-switcher" role="group" aria-label="语言切换">
          <button class="lang-btn active" data-lang="zh-CN" aria-label="切换到中文" aria-pressed="true">中文</button>
          <button class="lang-btn" data-lang="en" aria-label="Switch to English" aria-pressed="false">English</button>
        </div>
        
        <button class="mobile-menu-toggle" aria-label="打开菜单" aria-expanded="false" aria-controls="mobile-menu">
          <span class="menu-icon"></span>
        </button>
      </div>
    </nav>
    
    <div class="mobile-menu" id="mobile-menu" aria-hidden="true">
      <button class="mobile-menu-close" aria-label="关闭菜单">
        <span class="close-icon"></span>
      </button>
      <ul class="mobile-nav">
        <li><a href="/" class="mobile-nav-link" data-nav="home" data-i18n="nav.home">首页</a></li>
        <li><a href="/products" class="mobile-nav-link" data-nav="products" data-i18n="nav.products">作品</a></li>
        <li class="mobile-nav-dropdown">
          <a href="/team" class="mobile-nav-link mobile-nav-dropdown-toggle active" data-nav="team" data-i18n="nav.team" aria-expanded="false">关于我们</a>
          <ul class="mobile-nav-dropdown-menu" role="menu">
            <li><a href="/team" class="mobile-nav-dropdown-item" data-nav="team-intro" data-i18n="nav.submenu.intro">团队介绍</a></li>
            <li><a href="/social" class="mobile-nav-dropdown-item" data-nav="social" data-i18n="nav.submenu.social">关注我们</a></li>
          </ul>

        <button class="lang-btn active" data-lang="zh-CN">中文</button>
        <button class="lang-btn" data-lang="en">English</button>
      </div>
    </div>

  <main id="main-content" role="main">
    <section class="page social-page">
      <div class="container">
        <header class="page-header">
          <h1 class="page-title" data-i18n="social.title">快来关注我们！</h1>
          <p class="page-subtitle" data-i18n="social.subtitle">在很多地方都可以找到我们哟~~~</p>
        </header>
        
        <div class="social-grid" id="socialGrid">
          <article class="social-card" data-animate data-platform="bilibili">
            <a href="https://space.bilibili.com/1998764" class="social-card-link" target="_blank" rel="noopener noreferrer" data-i18n-href="social.bilibili.link" data-i18n-aria-label="social.bilibili.ariaLabel">
              <div class="social-card-icon">
                <img src="../img/social/bilibili.svg" alt="B站" loading="lazy" onerror="this.style.display='none'; this.nextElementSibling.style.display='flex';">
                <span class="social-icon-placeholder" style="display: none;">B</span>
              </div>
              <div class="social-card-content">
                <h2 class="social-platform-name" data-i18n="social.bilibili.name">哔哩哔哩</h2>
                <p class="social-platform-id" data-i18n="social.bilibili.id">官方账号</p>
                <p class="social-platform-desc" data-i18n="social.bilibili.desc">点击可跳转B站页面</p>
              </div>
              <div class="social-card-arrow">
                <svg width="24" height="24" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                  <path d="M5 12H19M19 12L12 5M19 12L12 19" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                </svg>
              </div>
            </a>
          </article>

          <article class="social-card" data-animate data-platform="xiaohongshu">
            <a href="https://xhslink.com/m/9SQhZNBXYe6" class="social-card-link" target="_blank" rel="noopener noreferrer" data-i18n-href="social.xiaohongshu.link" data-i18n-aria-label="social.xiaohongshu.ariaLabel">
              <div class="social-card-icon">
                <img src="../img/social/xiaohongshu.svg" alt="小红书" loading="lazy" onerror="this.style.display='none'; this.nextElementSibling.style.display='flex';">
                <span class="social-icon-placeholder" style="display: none;">红</span>
              </div>
              <div class="social-card-content">
                <h2 class="social-platform-name" data-i18n="social.xiaohongshu.name">小红书</h2>
                <p class="social-platform-id" data-i18n="social.xiaohongshu.id">官方账号</p>
                <p class="social-platform-desc" data-i18n="social.xiaohongshu.desc">点击可跳转小红书页面</p>
              </div>
              <div class="social-card-arrow">
                <svg width="24" height="24" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                  <path d="M5 12H19M19 12L12 5M19 12L12 19" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                </svg>
              </div>
            </a>
          </article>

          <article class="social-card" data-animate data-platform="weibo">
            <a href="https://weibo.com/u/7454292770" class="social-card-link" target="_blank" rel="noopener noreferrer" data-i18n-href="social.weibo.link" data-i18n-aria-label="social.weibo.ariaLabel">
              <div class="social-card-icon">
                <img src="../img/social/weibo.svg" alt="微博" loading="lazy" onerror="this.style.display='none'; this.nextElementSibling.style.display='flex';">
                <span class="social-icon-placeholder" style="display: none;">微</span>
              </div>
              <div class="social-card-content">
                <h2 class="social-platform-name" data-i18n="social.weibo.name">微博</h2>
                <p class="social-platform-id" data-i18n="social.weibo.id">官方账号</p>
                <p class="social-platform-desc" data-i18n="social.weibo.desc">点击可跳转微博页面</p>
              </div>
              <div class="social-card-arrow">
                <svg width="24" height="24" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                  <path d="M5 12H19M19 12L12 5M19 12L12 19" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                </svg>
              </div>
            </a>
          </article>

          <article class="social-card" data-animate data-platform="douyin">
            <a href="https://v.douyin.com/7aRwjrswLog/" class="social-card-link" target="_blank" rel="noopener noreferrer" data-i18n-href="social.douyin.link" data-i18n-aria-label="social.douyin.ariaLabel">
              <div class="social-card-icon">
                <img src="../img/social/douyin.svg" alt="抖音" loading="lazy" onerror="this.style.display='none'; this.nextElementSibling.style.display='flex';">
                <span class="social-icon-placeholder" style="display: none;">抖</span>
              </div>
              <div class="social-card-content">
                <h2 class="social-platform-name" data-i18n="social.douyin.name">抖音</h2>
                <p class="social-platform-id" data-i18n="social.douyin.id">官方账号</p>
                <p class="social-platform-desc" data-i18n="social.douyin.desc">点击可跳转抖音页面</p>
              </div>
              <div class="social-card-arrow">
                <svg width="24" height="24" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                  <path d="M5 12H19M19 12L12 5M19 12L12 19" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                </svg>
              </div>
            </a>
          </article>
        </div>
      </div>
